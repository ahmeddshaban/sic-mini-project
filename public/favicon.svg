<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Main Cyan-Indigo Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Center Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0" />
    </radialGradient>

    <!-- Chip Background Gradient -->
    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#090f21" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />

  <!-- Ambient Glow Behind Core -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientGlow)" />

  <!-- Hexagonal IoT Network Perimeter Grid Lines -->
  <!-- Vertices: Top(256, 92), TR(398, 174), BR(398, 338), Bot(256, 420), BL(114, 338), TL(114, 174) -->
  <polygon points="256,92 398,174 398,338 256,420 114,338 114,174" 
           fill="none" 
           stroke="url(#primaryGrad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           opacity="0.85" />

  <!-- Secondary Inner Data Geometry -->
  <polygon points="256,128 366,192 366,320 256,384 146,320 146,192" 
           fill="none" 
           stroke="#06b6d4" 
           stroke-width="3" 
           stroke-dasharray="10 8" 
           opacity="0.4" />

  <!-- Radial Spoke Data Traces (Connecting Hex Vertices to Chip) -->
  <line x1="256" y1="92" x2="256" y2="190" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="398" y1="174" x2="310" y2="225" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="398" y1="338" x2="310" y2="287" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="420" x2="256" y2="322" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="114" y1="338" x2="202" y2="287" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="114" y1="174" x2="202" y2="225" stroke="url(#primaryGrad)" stroke-width="10" stroke-linecap="round" />

  <!-- Microchip Pins -->
  <!-- Top/Bottom Pins -->
  <line x1="230" y1="184" x2="230" y2="202" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" />
  <line x1="282" y1="184" x2="282" y2="202" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" />
  <line x1="230" y1="310" x2="230" y2="328" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
  <line x1="282" y1="310" x2="282" y2="328" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
  <!-- Left/Right Pins -->
  <line x1="184" y1="230" x2="202" y2="230" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" />
  <line x1="184" y1="282" x2="202" y2="282" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />
  <line x1="310" y1="230" x2="328" y2="230" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" />
  <line x1="310" y1="282" x2="328" y2="282" stroke="#6366f1" stroke-width="8" stroke-linecap="round" />

  <!-- Central IoT Gateway Chip -->
  <rect x="202" y="202" width="108" height="108" rx="24" 
        fill="url(#chipBg)" 
        stroke="url(#primaryGrad)" 
        stroke-width="9" 
        filter="url(#neonGlow)" />

  <!-- Central Pulsing Quantum / Sensor Core -->
  <circle cx="256" cy="256" r="32" fill="url(#pulseGlow)" />
  <circle cx="256" cy="256" r="16" fill="#00f2fe" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- Hexagonal Peripheral Nodes (Sensor & Actuator Endpoints) -->
  <!-- Top Node -->
  <circle cx="256" cy="92" r="18" fill="#00f2fe" stroke="#080d1a" stroke-width="6" />
  <!-- Top Right Node with Wireless Wave Emit -->
  <circle cx="398" cy="174" r="18" fill="#22d3ee" stroke="#080d1a" stroke-width="6" />
  <!-- Bottom Right Node -->
  <circle cx="398" cy="338" r="18" fill="#6366f1" stroke="#080d1a" stroke-width="6" />
  <!-- Bottom Node -->
  <circle cx="256" cy="420" r="18" fill="#818cf8" stroke="#080d1a" stroke-width="6" />
  <!-- Bottom Left Node -->
  <circle cx="114" cy="338" r="18" fill="#10b981" stroke="#080d1a" stroke-width="6" />
  <!-- Top Left Node -->
  <circle cx="114" cy="174" r="18" fill="#06b6d4" stroke="#080d1a" stroke-width="6" />

  <!-- Inner Node Highlights -->
  <circle cx="256" cy="92" r="6" fill="#ffffff" />
  <circle cx="398" cy="174" r="6" fill="#ffffff" />
  <circle cx="398" cy="338" r="6" fill="#ffffff" />
  <circle cx="256" cy="420" r="6" fill="#ffffff" />
  <circle cx="114" cy="338" r="6" fill="#ffffff" />
  <circle cx="114" cy="174" r="6" fill="#ffffff" />

  <!-- Telemetry Wireless Signal Broadcast Arcs (Top Right) -->
  <path d="M 424 136 A 34 34 0 0 1 454 166" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" opacity="0.9" />
  <path d="M 438 112 A 62 62 0 0 1 484 158" fill="none" stroke="#00f2fe" stroke-width="9" stroke-linecap="round" opacity="0.8" />
</svg>
